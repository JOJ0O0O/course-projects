name: Test MAT-MEK4270 projects

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install
    - name: Install dependencies
      run: uv sync --locked
    - name: Test with pytest
      run: |
        cd projects
        uv run pytest decay_v3.py mesh_function.py differentiate.py poisson.py poisson2d.py
